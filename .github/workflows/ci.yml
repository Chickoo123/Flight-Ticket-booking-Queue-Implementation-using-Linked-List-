name: Build & test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - name: Build and test (${{ matrix.cxx }})
        run: make test CXX=${{ matrix.cxx }}
      - name: Re-run tests under AddressSanitizer + UBSan
        run: |
          make clean
          make test CXX=${{ matrix.cxx }} CXXFLAGS="-std=c++17 -g -O1 -Wall -Wextra -Werror -Iinclude -fsanitize=address,undefined -fno-omit-frame-pointer"
